# ==========================================================
#   TEE Encryption - macOS build
#   Builds the universal "TEE Encryption.app" (Apple Silicon + Intel),
#   the DMG and the PKG installer on a real Mac, installs and launches
#   them (Dock check, Intel/Rosetta run) and uploads the installers.
#   Pushing a tag like v4.2.1 attaches the installers to the release.
# ==========================================================
name: macOS Build (DMG + PKG)

on:
  # master and release tags build on push, pull requests build on every
  # update - so the head commit of a PR always carries a real build result
  push:
    branches: ["master"]
    tags: ["v*"]
    paths:
      - "TEE_Encryption_V*_GUI.py"
      - "TEE_encryption_GOLD.png"
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "TEE_Encryption_V*_GUI.py"
      - "TEE_encryption_GOLD.png"
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (universal app, DMG, PKG)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
      COCOAPODS_DISABLE_STATS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          xcodebuild -version
          echo "CocoaPods $(pod --version)"
          python3 --version

      - name: Cache Flutter SDK (installed by flet build)
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/pyproject.toml') }}

      - name: Cache Dart/Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/pyproject.toml') }}

      - name: Build app, DMG and PKG
        run: ./macos/build_macos.sh

      - name: Smoke test (install, launch, Dock, Intel via Rosetta)
        run: ./macos/smoke_test.sh

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEE_Encryption_macOS
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          compression-level: 0

      - name: Upload smoke-test results (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: dist/smoke-test/
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/macos/flet-build.log
          if-no-files-found: ignore

  release:
    name: Attach installers to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: TEE_Encryption_macOS
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.pkg
            dist/SHA256SUMS.txt
